<div id="webhook_popup" class="dialog_popup callflows-port callflow-action-form call-tag-popup">
    <form id="webhook_form" method="post" action="#">
        <div class="form_content">
            <div class="popup_field">
                <label for="name">
                    Call Tag
                </label>
                <div class="select_wrapper">
                    <select id="name" name="name" data-placeholder="Select a call tag...">
                        <option value="null"></option>  <!-- Empty option for Chosen placeholder -->
                        {{#select dimension.id}}
                            {{#each callTags}}
                                <option value="{{id}}">{{name}}</option>
                            {{/each}}
                        {{/select}}
                    </select>
                    <div class="clear"></div>
                </div>
            </div>
            <div class="popup_field">
                <label for="tagValue">
                     Tag Value
                </label>
                <div class="select_wrapper">
                    <input type="text" id="tagValue" name="tagValue" value="{{dimension.tagValue}}"/>
                    <div class="clear"></div>
                </div>
            </div>
            <div id="numericRangeMessage">
                <div class="help-text">
                    {{#monsterText}}
                        <span id="numericRangeHint"></span>
                    {{/monsterText}}
                </div>
            </div>
        </div>
        <div id="tagDeletedMessage">
            <div class="help-text">
                <br>
                {{#monsterText}}
                    {{ i18n.callflows.callTag.tagDeleted }}
                {{/monsterText}}
            </div>
        </div>
	</form>
    <div class="buttons-center">
        <button id="add" class="monster-button monster-button-primary">{{i18n.save}}</button>
    </div>
</div>
